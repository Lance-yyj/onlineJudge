# HydroOJ 判题系统配置
hydro:
  judge:
    # HydroOJ API 基础URL
    # Java 应用运行在宿主机上，直接使用 localhost
    # HydroOJ 使用 domain system 架构，路径为 /d/system/
    base-url: http://127.0.0.1:80
    # API Token（如果HydroOJ不需要认证，可以留空）
    api-token: ""
    # Hydro 用户名（用于登录认证）
    username: "yyj"
    # Hydro 密码（用于登录认证）
    password: "yyj123"
    # 连接超时时间（毫秒）
    connect-timeout: 5000
    # 读取超时时间（毫秒）
    read-timeout: 30000
    # 写入超时时间（毫秒）
    write-timeout: 30000