# HydroOJ 判题系统配置
hydro:
  judge:
    # HydroOJ API 基础URL（根据实际部署地址修改）
    # 注意：Docker容器中8888端口映射到宿主机80端口
    base-url: http://localhost:80
    # API Token（如果HydroOJ不需要认证，可以留空）
    api-token: ""
    # 连接超时时间（毫秒）
    connect-timeout: 5000
    # 读取超时时间（毫秒）
    read-timeout: 30000
    # 写入超时时间（毫秒）
    write-timeout: 30000